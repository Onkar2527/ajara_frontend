<nz-layout>
  <nz-header *ngIf="isLoggedIn">
 
  </nz-header>

  <nz-layout class="layout">
    <nz-sider nzCollapsible [(nzCollapsed)]="isCollapsed" [nzTrigger]="null" *ngIf="isLoggedIn">
      <div class="user-box"></div>

      <ul nz-menu nzTheme="dark" nzMode="inline" class="sider">
        <li nz-menu-item class="menu-item">
          <a routerLink="/new-account/tabs/personal">
            <span nz-icon nzType="plus-circle" nzTheme="outline"></span>
            <span>New Account</span>
          </a>

        </li>
        <li nz-menu-item class="menu-item">
          <span nz-icon nzType="history"></span>
          <span>A/C History</span>
        </li>

        <li nz-menu-item class="menu-item">
          <span nz-icon nzType="edit"></span>
          <span>Draft</span>
        </li>

        <li nz-menu-item class="menu-item">
          <span nz-icon nzType="user"></span>
          <span>eKYC</span>
        </li>
        <li nz-menu-item class="menu-item">
          <a routerLink="/login">
            <span nz-icon nzType="user"></span>
            <span>Login</span>
          </a>
        </li>

      </ul>
    </nz-sider>
    <nz-content>
      <div class="inner-content">
        <router-outlet></router-outlet>
      </div>
    </nz-content>

  </nz-layout>
</nz-layout>
