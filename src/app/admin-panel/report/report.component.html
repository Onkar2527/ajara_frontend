<div class="card">
    <h3>Manage Report</h3>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Sr No.</th>
                <th>Name</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            <tr *ngFor="let rpt of reportList; let i = index">
                <td>{{ i + 1 }}</td>
                <td>{{ rpt.REPORT_NAME }}</td>
                <td>
                    <!-- <a class="text-primary"
             style="cursor: pointer"
             (click)="openReport(rpt)">
            Report
          </a> -->
                    <a style="cursor:pointer" (click)="openReport(rpt)">
                        Report
                    </a>
                </td>
            </tr>

            <tr *ngIf="reportList.length === 0 && !loading">
                <td colspan="3" class="text-center">
                    No Reports Found
                </td>
            </tr>
        </tbody>
    </table>
</div>

<nz-drawer [nzTitle]="selectedReport?.REPORT_NAME || 'Report View'" [nzVisible]="isDrawerVisible" nzPlacement="right" [nzWidth]="1200" (nzOnClose)="closeDrawer()">
