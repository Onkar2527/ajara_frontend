<div>
    <div style="margin-bottom: 12px; display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 0 8px;">
        <span style="font-weight: 600; color: #1890ff;">Test Mode:</span>
        <nz-switch [(ngModel)]="isTestMode" nzCheckedChildren="ON" nzUnCheckedChildren="OFF"></nz-switch>
    </div>

    <nz-tabset [(nzSelectedIndex)]="selectedIndex" (nzSelectChange)="log([$event])">
        <nz-tab *ngFor="let tab of Tabs;let i=index" [nzTitle]="titleTemplate33" [nzDisabled]="tab.disabled">

            <ng-template #titleTemplate33>

                <i nz-icon nzType="exclamation-circle" nzTheme="fill" style="color: #f18304;"
                    *ngIf="!Tabs[i].IS_PROVIDED && i!=5"></i>

                <i nz-icon nzType="check-circle" nzTheme="fill" style="color: #00b963;"
                    *ngIf="Tabs[i].IS_PROVIDED && i!=5"></i>

                <span> {{tab.TAB_NAME}}</span>
            </ng-template>

            <app-personal [basicInfo]="BasicInfo" [APPLICANT_ID]="APPLICANT_ID" *ngIf="tab.TAB_ID == 1"></app-personal>

            <app-deposit *ngIf="tab.TAB_ID == 2"></app-deposit>

            <app-nomination *ngIf="tab.TAB_ID == 3"></app-nomination>

            <app-services *ngIf="tab.TAB_ID == 4"></app-services>

            <app-applicant-details *ngIf="tab.TAB_ID == 5"></app-applicant-details>

            <app-remark-comp *ngIf="tab.TAB_ID == 6"></app-remark-comp>

            <!-- <app-verifier-verification *ngIf="tab.TAB_ID == 7"></app-verifier-verification> -->

        </nz-tab>


    </nz-tabset>

    <nz-modal [(nzVisible)]="isTestModalVisible" nzTitle="Test Mode - Generated Account Opening JSON Payload" (nzOnCancel)="closeTestModal()" [nzWidth]="800" [nzFooter]="modalFooter">
        <ng-template #modalFooter>
            <button nz-button nzType="default" (click)="closeTestModal()">Cancel</button>
            <button nz-button nzType="primary" [nzLoading]="isConfirmingAccount" (click)="confirmAccountCreationInTestMode()">Confirm & Create Account</button>
        </ng-template>
        <ng-container *nzModalContent>
            <p style="font-weight: 500; margin-bottom: 8px; color: #1890ff;">Review the generated account opening JSON payload below. Click <strong>Confirm & Create Account</strong> to execute account creation in CBS.</p>
            <pre style="background: #272822; color: #f8f8f2; padding: 12px; max-height: 450px; overflow: auto; border-radius: 6px; font-family: monospace; font-size: 12px;">{{ testJsonPayloadString }}</pre>
        </ng-container>
    </nz-modal>

</div>
