<nz-tabset [(nzSelectedIndex)]="selectedIndex" (nzSelectChange)="log([$event])">
    <nz-tab nzLinkRouter >
        <a *nzTabLink nz-tab-link [routerLink]="['./personal']">
            Personal Information
        </a>
        <app-personal></app-personal>
    </nz-tab>
    <nz-tab nzLinkRouter>
        <a *nzTabLink nz-tab-link [routerLink]="['./deposit']">
            Deposit Details
        </a>
        <app-deposit></app-deposit>
    </nz-tab>
    <nz-tab nzLinkRouter>
        <a *nzTabLink nz-tab-link [routerLink]="['./nomination']">
            Nomination Details
        </a>
        <app-nomination></app-nomination>
    </nz-tab>
    <nz-tab nzLinkRouter>
        <a *nzTabLink nz-tab-link [routerLink]="['./services']">
            Extra Services and Linkages
        </a>
        <app-services></app-services>
    </nz-tab>
    <nz-tab nzLinkRouter>
        <a *nzTabLink nz-tab-link [routerLink]="['./form']">
            Form
        </a>
        <app-form style="height:100%"></app-form>
    </nz-tab>
</nz-tabset>

<nz-footer>
    <button nz-button nzType="primary"  (click)="saveANext()" [nzLoading]="loanSaveButton"><span *ngIf="selectedIndex != 4">Save and Next</span><span *ngIf="selectedIndex == 4">Download PDF</span></button>
</nz-footer>
