<div nz-row>
    <div nz-col nzSpan="11">

        <div class="box">
            <nz-divider nzText="Account Details"></nz-divider>
            <div nz-row class="content-box">
                <nz-form-item nz-col nzSpan="24">
                    <nz-form-control>
                        <nz-form-label nzRequired [nzNoColon]="true">Account Type</nz-form-label>
                        <nz-select [(ngModel)]="depositInfo.ACCOUNT_TYPE">
                            <nz-option [nzValue]="'A'" nzLabel="Saving"></nz-option>
                            <nz-option [nzValue]="'B'" nzLabel="Janata Deposite"></nz-option>
                            <nz-option [nzValue]="'C'" nzLabel="Current Account"></nz-option>
                            <nz-option [nzValue]="'D'" nzLabel="Fixed Deposit"></nz-option>
                            <nz-option [nzValue]="'E'" nzLabel="Fixed Deposit (Reinvestment)"></nz-option>
                            <nz-option [nzValue]="'F'" nzLabel="Recurring Deposit"></nz-option>
                            <nz-option [nzValue]="'G'" nzLabel="Pigmy Deposit"></nz-option>
                            <nz-option [nzValue]="'H'" nzLabel="Other"></nz-option>
                        </nz-select>

                    </nz-form-control>
                </nz-form-item>

                <nz-form-item nz-col nzSpan="24">
                    <nz-form-control>
                        <nz-form-label nzRequired [nzNoColon]="true">Mode of Operation</nz-form-label>
                        <nz-select [(ngModel)]="depositInfo.ACCOUNT_OPERATION">
                            <nz-option [nzValue]="'A'" nzLabel="Individual"></nz-option>
                            <nz-option [nzValue]="'B'" nzLabel="Joint"></nz-option>
                            <nz-option [nzValue]="'C'" nzLabel="Either or Survivor"></nz-option>
                            <nz-option [nzValue]="'D'" nzLabel="Formar of Survivor"></nz-option>
                            <nz-option [nzValue]="'E'" nzLabel="Any One"></nz-option>
                            <nz-option [nzValue]="'F'" nzLabel="Any Two"></nz-option>
                        </nz-select>
                    </nz-form-control>
                </nz-form-item>

            </div>
        </div>

        <div class="box" *ngIf="depositInfo.ACCOUNT_TYPE == 'A'">
            <nz-divider nzText="Initial Payment Details"></nz-divider>
            <div nz-row class="content-box">

                <nz-form-item nz-col nzSpan="24">

                    <nz-form-label [nzNoColon]="true" nzRequired >Initial Amount </nz-form-label>
                    <nz-form-control>

                        <nz-input-group nzAddOnBefore="₹">
                            <input type="InitAmount" [(ngModel)]="depositInfo.INITIAL_AMOUNT" nz-input
                                placeholder="Enter Initial Amount" />
                        </nz-input-group>

                    </nz-form-control>

                </nz-form-item>


                <nz-form-item nz-col nzSpan="24">

                    <nz-form-label [nzNoColon]="true">Mode of payment</nz-form-label>
                    <nz-radio-group [(ngModel)]="depositInfo.MODE_OF_PAYMENT">
                        <label nz-radio [nzValue]="'C'">Cash</label>
                        <label nz-radio [nzValue]="'T'">Cheque</label>
                    </nz-radio-group>
                </nz-form-item>

                <div nz-col nzSpan="24" *ngIf="depositInfo.MODE_OF_PAYMENT == 'T'">
                    <div nz-row>
                        <nz-form-item nz-col nzSpan="24">

                            <nz-form-label [nzNoColon]="true">Account Number</nz-form-label>
                            <nz-form-control>

                                <nz-input-group>
                                    <input nz-input name="transAccount" [(ngModel)]="depositInfo.TRANSFER_ACCOUNT_NO"
                                        placeholder="Enter Account number" />
                                </nz-input-group>

                            </nz-form-control>

                        </nz-form-item>

                        <nz-form-item nz-col nzSpan="12">

                            <nz-form-label [nzNoColon]="true">Bank Name</nz-form-label>
                            <nz-form-control>

                                <nz-input-group>
                                    <input nz-input name="CHEQUE_BANK_NAME" [(ngModel)]="depositInfo.CHEQUE_BANK_NAME"
                                        placeholder="Enter Bank Name" />
                                </nz-input-group>

                            </nz-form-control>

                        </nz-form-item>

                        <div nz-col nzSpan="1"></div>

                        <nz-form-item nz-col nzSpan="11">

                            <nz-form-label [nzNoColon]="true">Branch Name</nz-form-label>
                            <nz-form-control>

                                <nz-input-group>
                                    <input nz-input name="CHEQUE_BRANCH_NAME"
                                        [(ngModel)]="depositInfo.CHEQUE_BRANCH_NAME" placeholder="Enter Branch Name" />
                                </nz-input-group>

                            </nz-form-control>

                        </nz-form-item>

                        <nz-form-item nz-col nzSpan="16">

                            <nz-form-label [nzNoColon]="true">Cheque No.</nz-form-label>
                            <nz-form-control>

                                <nz-input-group>
                                    <input nz-input name="Cheque" [(ngModel)]="depositInfo.CHAQUE_NO"
                                        placeholder="Cheque No." />
                                </nz-input-group>

                            </nz-form-control>

                        </nz-form-item>

                        <div nz-col nzSpan="1"></div>

                        <nz-form-item nz-col nzSpan="7">

                            <nz-form-label [nzNoColon]="true">Dated</nz-form-label>
                            <nz-form-control>

                                <nz-input-group>

                                    <input nz-input name="TRANSFER_DATE" mask="d0/M0/0000" [leadZeroDateTime]="true"
                                        [dropSpecialCharacters]="false" [(ngModel)]="depositInfo.TRANSFER_DATE"
                                        placeholder="dd/mm/yyyy">

                                </nz-input-group>

                            </nz-form-control>

                        </nz-form-item>


                    </div>
                </div>
            </div>
        </div>


        <div class="box" *ngIf="depositInfo.ACCOUNT_TYPE != 'A'">
            <nz-divider nzText="Deposit Details"></nz-divider>
            <div nz-row class="content-box">

                <nz-form-item nz-col nzSpan="24">

                    <nz-form-label [nzNoColon]="true">Deposit Amount </nz-form-label>
                    <br>
                    <nz-radio-group [(ngModel)]="depositInfo.DEPOSIT_FREQUANCY">
                        <label nz-radio [nzValue]="'O'">One Time</label>
                        <label nz-radio [nzValue]="'M'">Monthly</label>
                        <label nz-radio [nzValue]="'D'">Daily</label>
                    </nz-radio-group>

                </nz-form-item>

                <nz-form-item nz-col nzSpan="24">
                    <nz-form-control>

                        <div class="deposit">
                            <nz-input-group nzAddOnBefore="₹">
                                <input nz-input name="depositAmt" [(ngModel)]="depositInfo.DEPOSIT_AMOUNT"
                                    placeholder="Enter Deposit Amount" />
                            </nz-input-group>
                        </div>

                    </nz-form-control>
                </nz-form-item>

                <nz-form-item nz-col nzSpan="10">

                    <nz-form-label [nzNoColon]="true">Rate of Interest</nz-form-label>
                    <nz-input-group nzAddOnAfter="% p.a.">
                        <input nz-input name="roi" [(ngModel)]="depositInfo.RATE_OF_INTEREST"
                            placeholder="Enter Rate of Interest" />
                    </nz-input-group>
                </nz-form-item>

                <nz-form-item nz-col nzSpan="24">

                    <nz-form-label [nzNoColon]="true">Period</nz-form-label>

                    <nz-form-control>
                        <div nz-row>
                            <div nz-col nzSpan="7">
                                <input nz-input name="day" [(ngModel)]="depositInfo.TANURE_DAYS" placeholder="Days" />
                            </div>
                            <div nz-col nzSpan="1">
                            </div>
                            <div nz-col nzSpan="7">
                                <input nz-input name="month" [(ngModel)]="depositInfo.TANURE_MONTHS"
                                    placeholder="Months" />
                            </div>
                            <div nz-col nzSpan="1">
                            </div>
                            <div nz-col nzSpan="7">
                                <input nz-input name="year" [(ngModel)]="depositInfo.TANURE_YEARS"
                                    placeholder="Years" />
                            </div>
                        </div>

                    </nz-form-control>

                </nz-form-item>

                <nz-form-item nz-col nzSpan="24">

                    <nz-form-label [nzNoColon]="true">Desired Interest Payout</nz-form-label>
                    <nz-form-control>

                        <nz-radio-group [(ngModel)]=" depositInfo.INTEREST_PAYOUT">
                            <label nz-radio [nzValue]="'M'">Monthly</label>
                            <label nz-radio [nzValue]="'Q'">Quarterly</label>
                            <label nz-radio [nzValue]="'H'">Half Yearly</label>
                            <label nz-radio [nzValue]="'Y'">Yearly</label>
                            <label nz-radio [nzValue]="'O'">On Maturity</label>

                        </nz-radio-group>

                    </nz-form-control>

                </nz-form-item>

                <!-- <nz-form-item nz-col nzSpan="24">

                    <nz-form-label [nzNoColon]="true">Mode of Interest Payout</nz-form-label>
                    <nz-form-control>

                        <nz-radio-group [(ngModel)]="depositInfo.MODE_OF_INTEREST_PAYOUT">
                            <label nz-radio [nzValue]="S">Standing Instructions</label>
                            <label nz-radio [nzValue]="E">ECS</label>
                            <label nz-radio [nzValue]="P">Pay Order</label>
                            <label nz-radio [nzValue]="O">Other Bank Account</label>
                        </nz-radio-group>

                    </nz-form-control>

                </nz-form-item> -->

                <nz-form-item nz-col nzSpan="24">
                    <p>Auto Renewal ? <span><nz-switch [(ngModel)]="depositInfo.AUTO_RENEWAL" nzCheckedChildren="Yes"
                                nzUnCheckedChildren="No"></nz-switch></span></p>
                </nz-form-item>

            </div>
        </div>



    </div>

    <div nz-col nzSpan="1">
    </div>


    <div nz-col nzSpan="12" *ngIf="depositInfo.ACCOUNT_TYPE != 'A'">

        <div class="box">
            <nz-divider nzText="Bank Details"></nz-divider>
            <div class="content-box" nz-row>


                <nz-form-item nz-col nzSpan="24">

                    <nz-form-label [nzNoColon]="true">Bank Name</nz-form-label>
                    <nz-form-control>
                        <input nz-input name="bank_name" [(ngModel)]="depositInfo.DEPOSIT_BANK_NAME"
                            placeholder="Enter Bank Name" />
                    </nz-form-control>
                </nz-form-item>

                <nz-form-item nz-col nzSpan="13">

                    <nz-form-label [nzNoColon]="true">Branch Name</nz-form-label>
                    <nz-form-control>
                        <input nz-input name="branch_name" [(ngModel)]="depositInfo.DEPOSIT_BRANCH_NAME"
                            placeholder="Enter Branch Name" />
                    </nz-form-control>
                </nz-form-item>

                <div nz-col nzSpan="1">
                </div>

                <nz-form-item nz-col nzSpan="10">

                    <nz-form-label [nzNoColon]="true">IFSC Code</nz-form-label>
                    <nz-form-control>
                        <input nz-input name="ifsc" [(ngModel)]="depositInfo.DEPOSIT_IFSC_CODE"
                            placeholder="Enter IFSC Code" />
                    </nz-form-control>
                </nz-form-item>

                <nz-form-item nz-col nzSpan="13">

                    <nz-form-label [nzNoColon]="true">Account Number</nz-form-label>
                    <nz-form-control>
                        <input nz-input name="account_no" [(ngModel)]="depositInfo.DEPOSIT_ACCOUNT_NUMBER"
                            placeholder="Enter Account Number" />
                    </nz-form-control>
                </nz-form-item>


            </div>
        </div>


        <!-- <div class="box">
            <nz-divider nzText="TDS Preference"></nz-divider>
            <div class="content-box" nz-row>
                <nz-form-item nz-col nzSpan="24">

                    <nz-form-control>
                        <nz-radio-group [(ngModel)]="depositInfo.TDS">
                            <label nz-radio [nzValue]="T">Tax to be deduced at source/I agree & abide difference in
                                payable amount of cumulative / fixed deposit on maturity.</label>
                            <label nz-radio [nzValue]="N">Tax Not to be deduced at source - Form 15G / 15H
                                enclosed)</label>
                        </nz-radio-group>
                    </nz-form-control>
                </nz-form-item>
            </div>
        </div> -->


    </div>

</div>
