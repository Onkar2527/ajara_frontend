<div nz-row>
    <div nz-col nzSpan="11">
        <div class="box">
            <nz-divider nzText="Nomination Details"></nz-divider>

            <div nz-row class="content-box">
                <div nz-col nzSpan="24">
                    <p>Is Nominee minor?<span><nz-switch [(ngModel)]="nomineeInfo.IS_MINOR" nzCheckedChildren="Yes"
                                nzUnCheckedChildren="No"></nz-switch></span></p>
                </div>

                <nz-form-item nz-col nzSpan="24" *ngIf="nomineeInfo.IS_MINOR">
                    <nz-form-label [nzNoColon]="true">Minor's DOB</nz-form-label>
                    <nz-form-control>
                        <nz-date-picker [(ngModel)]="nomineeInfo.DOB" [nzFormat]="'yyyy/MM/dd'"></nz-date-picker>
                    </nz-form-control>
                </nz-form-item>

                <nz-form-item nz-col nzSpan="24">
                    <nz-form-label [nzNoColon]="true">Name of Nominee</nz-form-label>
                    <nz-form-control>
                        <input nz-input name="nominee" [(ngModel)]="nomineeInfo.NOMINEE_NAME"
                            placeholder="Enter Name of Nominee" />
                    </nz-form-control>
                </nz-form-item>

                <nz-form-item nz-col nzSpan="12" *ngIf="!nomineeInfo.IS_MINOR">
                    <nz-form-label [nzNoColon]="true">Nominee's DOB</nz-form-label>
                    <nz-form-control>
                        <nz-date-picker [(ngModel)]="nomineeInfo.NOMINEE_DOB"
                            [nzFormat]="'yyyy/MM/dd'"></nz-date-picker>
                    </nz-form-control>
                </nz-form-item>

                <!-- <nz-form-item nz-col nzSpan="12" *ngIf="!nomineeInfo.IS_MINOR">
                    <nz-form-label nzNoColon>Nominee's Age</nz-form-label>
                    <nz-form-control>
                        <input nz-input name="NOMINEE_AGE" type="text" style="width: 100%;"
                        [(ngModel)]="nomineeInfo.NOMINEE_AGE" required />
                    </nz-form-control>
                </nz-form-item> -->

                <nz-form-item nz-col nzSpan="24">
                    <nz-form-label [nzNoColon]="true">Relationship with Applicant</nz-form-label>
                    <nz-form-control>
                        <nz-select nzShowSearch [(ngModel)]="nomineeInfo.RELATION" style="width: 100%;">
                            <nz-option *ngFor="let option of optionList" [nzValue]="option.value"
                                [nzLabel]="option.label">
                            </nz-option>
                        </nz-select>
                    </nz-form-control>
                </nz-form-item>

                <nz-form-item nz-col nzSpan="24">
                    <nz-form-label [nzNoColon]="true">Address of Nominee</nz-form-label>
                    <nz-form-control>
                        <div nz-row>
                            <textarea rows="2" nz-input [(ngModel)]="nomineeInfo.NOMINEE_ADDRESS"></textarea>
                        </div>
                    </nz-form-control>
                </nz-form-item>
            </div>
        </div>
    </div>
    <div nz-col nzSpan="1">
    </div>
    <div nz-col nzSpan="12" *ngIf="nomineeInfo.IS_MINOR">
        <div class="box">
            <nz-divider nzText="Appointed Person for Minor"></nz-divider>

            <div class="content-box" nz-row>
                <nz-form-item nz-col nzSpan="24">
                    <nz-form-label [nzNoColon]="true">Name of Appointed Person</nz-form-label>
                    <nz-form-control>
                        <input nz-input name="appointed" [(ngModel)]="nomineeInfo.APONITED_NAME"
                            placeholder="Enter Name of Appointed Person" />
                    </nz-form-control>
                </nz-form-item>

                <nz-form-item nz-col nzSpan="24">
                    <nz-form-label [nzNoColon]="true">Address of Appointed Person</nz-form-label>
                    <nz-form-control>
                        <div nz-row>
                            <textarea rows="2" nz-input [(ngModel)]="nomineeInfo.APONITED_ADDRESS"></textarea>
                        </div>
                    </nz-form-control>
                </nz-form-item>

            </div>
        </div>
    </div>


</div>
