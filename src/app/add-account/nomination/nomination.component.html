<div nz-row>
    <div nz-col nzSpan="11">
        <div class="box">
            <nz-divider nzText="Nomination Details"></nz-divider>

            <div nz-row class="content-box">
                <div nz-col nzSpan="24">
                    <p>Is Nominee minor?<span><nz-switch nzCheckedChildren="Yes"
                                nzUnCheckedChildren="No"></nz-switch></span></p>
                </div>
                <nz-form-item nz-col nzSpan="24">
                    <nz-form-label [nzNoColon]="true">Minor's DOB</nz-form-label>
                    <nz-form-control>
                        <nz-date-picker [nzFormat]="'yyyy/MM/dd'"></nz-date-picker>
                    </nz-form-control>
                </nz-form-item>
                <nz-form-item nz-col nzSpan="24">
                    <nz-form-label [nzNoColon]="true">Name of Nominee</nz-form-label>
                    <nz-form-control>
                        <input nz-input name="nominee" placeholder="Enter Name of Nominee" />
                    </nz-form-control>
                </nz-form-item>

                <nz-form-item nz-col nzSpan="24">
                    <nz-form-label [nzNoColon]="true">Relationship with Applicant</nz-form-label>
                    <nz-form-control>
                        <input nz-input name="relationship" placeholder="Enter Nominee's Relationship with Applicant" />
                    </nz-form-control>
                </nz-form-item>

                <nz-form-item nz-col nzSpan="24">
                    <nz-form-label [nzNoColon]="true">Address of Nominee</nz-form-label>
                    <nz-form-control>
                        <div nz-row>
                            <textarea rows="2" nz-input></textarea>
                        </div>
                    </nz-form-control>
                </nz-form-item>
            </div>
        </div>
    </div>
    <div nz-col nzSpan="1">
    </div>
    <div nz-col nzSpan="12">
        <div class="box">
            <nz-divider nzText="Appointed Person for Minor"></nz-divider>

            <div class="content-box" nz-row>
                <nz-form-item nz-col nzSpan="24">
                    <nz-form-label [nzNoColon]="true">Name of Appointed Person</nz-form-label>
                    <nz-form-control>
                        <input nz-input name="appointed" placeholder="Enter Name of Appointed Person" />
                    </nz-form-control>
                </nz-form-item>

                <nz-form-item nz-col nzSpan="24">
                    <nz-form-label [nzNoColon]="true">Address of Appointed Person</nz-form-label>
                    <nz-form-control>
                        <div nz-row>
                            <textarea rows="2" nz-input></textarea>
                        </div>
                    </nz-form-control>
                </nz-form-item>

            </div>
        </div>
    </div>


</div>
